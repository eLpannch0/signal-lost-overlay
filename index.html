<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>eLpannCh0 Twitch Neon</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:Arial,Helvetica,sans-serif}
.stage{position:relative;width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;isolation:isolate}
.aura{position:absolute;width:78%;height:55%;border-radius:50%;
background:radial-gradient(ellipse,rgba(145,70,255,.25) 0%,rgba(105,35,205,.12) 35%,rgba(32,8,70,.04) 58%,transparent 74%);
filter:blur(25px);animation:aura 3.8s ease-in-out infinite}
.card{position:relative;width:min(92vw,1050px);height:min(72vh,230px);min-height:130px;
display:flex;align-items:center;justify-content:center;gap:clamp(18px,3vw,38px);
padding:20px 48px;border-radius:34px;
background:linear-gradient(135deg,rgba(12,5,25,.91),rgba(25,8,52,.86) 45%,rgba(10,4,23,.92));
border:1px solid rgba(157,91,255,.42);
box-shadow:0 0 18px rgba(145,70,255,.26),0 0 50px rgba(86,22,170,.17),inset 0 1px 0 rgba(196,156,255,.12),inset 0 -14px 40px rgba(76,20,145,.10);
backdrop-filter:blur(10px);animation:float 4.5s ease-in-out infinite;overflow:hidden}
.card:before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;
background:linear-gradient(100deg,transparent 5%,rgba(126,61,225,.45),rgba(191,130,255,.58),rgba(104,44,210,.35),transparent 95%);
-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:.75}
.grid{position:absolute;inset:0;opacity:.09;background-image:linear-gradient(rgba(151,91,255,.22) 1px,transparent 1px),linear-gradient(90deg,rgba(151,91,255,.18) 1px,transparent 1px);background-size:36px 36px;transform:perspective(400px) rotateX(62deg) scale(1.7);transform-origin:center bottom}
.orb{position:absolute;border-radius:50%;filter:blur(1px);background:#9b5cff;box-shadow:0 0 8px #9146ff,0 0 18px rgba(145,70,255,.75);opacity:0;animation:particle linear infinite}
.iconbox{position:relative;width:clamp(68px,10vw,112px);height:clamp(68px,10vw,112px);display:grid;place-items:center;flex:none}
.ring{position:absolute;inset:-10%;border:1px solid rgba(151,86,255,.42);border-radius:28px;transform:rotate(45deg);box-shadow:0 0 18px rgba(145,70,255,.20);animation:ring 5s linear infinite}
.icon{width:74%;height:74%;filter:drop-shadow(0 0 7px rgba(145,70,255,.75)) drop-shadow(0 0 18px rgba(145,70,255,.34));animation:pulse 2.8s ease-in-out infinite}
.copy{position:relative;display:flex;flex-direction:column;justify-content:center;min-width:0}
.kicker{font-size:clamp(13px,2vw,21px);font-weight:800;letter-spacing:.36em;color:#b783ff;text-transform:uppercase;margin:0 0 8px 4px;text-shadow:0 0 10px rgba(145,70,255,.50)}
.name{position:relative;font-size:clamp(39px,7.2vw,84px);font-weight:900;letter-spacing:.015em;line-height:.92;
color:#d6b8ff;
background:linear-gradient(180deg,#eadcff 0%,#bf8aff 46%,#9146ff 100%);
-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
filter:drop-shadow(0 0 4px rgba(166,103,255,.48)) drop-shadow(0 0 14px rgba(117,45,230,.38));
animation:textGlow 3.2s ease-in-out infinite;white-space:nowrap}
.underline{width:100%;height:2px;margin-top:13px;background:linear-gradient(90deg,#9146ff 0%,#b46fff 45%,rgba(145,70,255,0) 100%);box-shadow:0 0 8px rgba(145,70,255,.6);transform-origin:left;animation:line 4s ease-in-out infinite}
.sweep{position:absolute;top:-50%;left:-22%;width:10%;height:200%;transform:rotate(16deg);background:linear-gradient(90deg,transparent,rgba(181,126,255,.13),transparent);animation:sweep 5.8s ease-in-out infinite;pointer-events:none}
.corner{position:absolute;width:32px;height:32px;border-color:rgba(164,99,255,.55)}
.c1{left:15px;top:15px;border-left:2px solid;border-top:2px solid;border-radius:8px 0 0 0}
.c2{right:15px;bottom:15px;border-right:2px solid;border-bottom:2px solid;border-radius:0 0 8px 0}
@keyframes aura{0%,100%{transform:scale(.94);opacity:.55}50%{transform:scale(1.06);opacity:.9}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes ring{0%{transform:rotate(45deg)}100%{transform:rotate(405deg)}}
@keyframes pulse{0%,100%{transform:scale(1);filter:drop-shadow(0 0 7px rgba(145,70,255,.65)) drop-shadow(0 0 15px rgba(145,70,255,.28))}50%{transform:scale(1.055);filter:drop-shadow(0 0 9px rgba(170,105,255,.85)) drop-shadow(0 0 24px rgba(145,70,255,.42))}}
@keyframes textGlow{0%,100%{filter:drop-shadow(0 0 4px rgba(166,103,255,.45)) drop-shadow(0 0 13px rgba(117,45,230,.32))}50%{filter:drop-shadow(0 0 6px rgba(183,125,255,.65)) drop-shadow(0 0 20px rgba(117,45,230,.48))}}
@keyframes line{0%,100%{transform:scaleX(.68);opacity:.5}50%{transform:scaleX(1);opacity:1}}
@keyframes sweep{0%,22%{left:-25%;opacity:0}32%{opacity:1}58%{left:118%;opacity:.65}70%,100%{left:118%;opacity:0}}
@keyframes particle{0%{transform:translate3d(0,35px,0) scale(.4);opacity:0}15%{opacity:.6}70%{opacity:.35}100%{transform:translate3d(var(--dx),-150px,0) scale(1);opacity:0}}
@media(max-width:600px){.card{padding:16px 26px;border-radius:25px;gap:17px}.kicker{letter-spacing:.25em}.underline{margin-top:9px}}
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="aura"></div>
  <div class="card">
    <div class="grid"></div><div class="sweep"></div>
    <div class="corner c1"></div><div class="corner c2"></div>
    <div class="iconbox">
      <div class="ring"></div>
      <svg class="icon" viewBox="0 0 64 64" aria-hidden="true">
        <path fill="#9146FF" d="M9 5h50v35L44 55H33l-9 8v-8H9V5zm9 9v32h10v8l8-8h8l7-7V14H18z"/>
        <path fill="#C9A0FF" d="M30 22h6v14h-6V22zm12 0h6v14h-6V22z"/>
      </svg>
    </div>
    <div class="copy">
      <div class="kicker">TWITCH</div>
      <div class="name">eLpannCh0</div>
      <div class="underline"></div>
    </div>
  </div>
</div>
<script>
const stage=document.getElementById('stage');
function particle(){
 const p=document.createElement('i');p.className='orb';
 const s=1.5+Math.random()*3.2;
 p.style.width=s+'px';p.style.height=s+'px';
 p.style.left=(10+Math.random()*80)+'%';
 p.style.top=(48+Math.random()*34)+'%';
 p.style.setProperty('--dx',(Math.random()*110-55)+'px');
 const d=4.5+Math.random()*4;
 p.style.animationDuration=d+'s';
 stage.appendChild(p);setTimeout(()=>p.remove(),d*1000+300);
}
for(let i=0;i<14;i++)setTimeout(particle,i*180);
setInterval(particle,430);
</script>
</body>
</html>
